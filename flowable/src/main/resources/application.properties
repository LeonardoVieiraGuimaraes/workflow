spring.application.name=flowable

# H2 em memória
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flowable cria/atualiza schema automaticamente
flowable.database-schema-update=true

# Logging útil para depuração
logging.level.org.flowable=INFO
logging.level.org.springframework.web=INFO
